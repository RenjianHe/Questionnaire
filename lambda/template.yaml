AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Lambda + API Gateway 层（Python）。依赖 infrastructure/template.yaml 已部署导出的
  DynamoDB 表名（ImportValue）。SAM 会隐式创建一个 API Gateway REST API，
  三个业务 Lambda 通过 Events 绑定到对应的路由上。

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]

  AppName:
    Type: String
    Default: questionnaire-app

Globals:
  Function:
    Runtime: python3.12
    Timeout: 10
    MemorySize: 256
    # 四个函数共用同一份代码目录（src/），彼此靠 Handler 区分入口，
    # 不需要 Lambda Layer / 不需要 requirements.txt —— boto3 是 Python
    # Lambda 运行时自带的，这个项目没有用到其它第三方依赖。
    CodeUri: src/
    Environment:
      Variables:
        TABLE_NAME: !ImportValue
          Fn::Sub: '${AppName}-${Environment}-TableName'
        ENVIRONMENT: !Ref Environment

Resources:
  # ---------------------------------------------------------------------
  # Mock TransUnion 服务：被 Create / Update 函数以同步方式 Invoke，
  # 不挂 API Gateway。按 userId 稳定返回 700 或 500。
  # ---------------------------------------------------------------------
  TransUnionMockFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AppName}-${Environment}-transunion-mock'
      Handler: handlers.transunion_mock.handler
      Description: 模拟 TransUnion，按 userId 返回 700 或 500 的信用分

  ApplicationsApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: !Ref Environment

  CreateApplicationFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AppName}-${Environment}-create-application'
      Handler: handlers.create_application.handler
      Description: POST /applications - 创建 questionnaire 申请并调用 TransUnion(Mock)
      Environment:
        Variables:
          TRANSUNION_FUNCTION_NAME: !Ref TransUnionMockFunction
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !ImportValue
              Fn::Sub: '${AppName}-${Environment}-TableName'
        - LambdaInvokePolicy:
            FunctionName: !Ref TransUnionMockFunction
      Events:
        CreateApplication:
          Type: Api
          Properties:
            RestApiId: !Ref ApplicationsApi
            Path: /applications
            Method: post

  UpdateApplicationFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AppName}-${Environment}-update-application'
      Handler: handlers.update_application.handler
      Description: PUT /applications/{applicationId} - 更新 questionnaire，重新查询 TransUnion(Mock)
      Environment:
        Variables:
          TRANSUNION_FUNCTION_NAME: !Ref TransUnionMockFunction
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !ImportValue
              Fn::Sub: '${AppName}-${Environment}-TableName'
        - LambdaInvokePolicy:
            FunctionName: !Ref TransUnionMockFunction
      Events:
        UpdateApplication:
          Type: Api
          Properties:
            RestApiId: !Ref ApplicationsApi
            Path: /applications/{applicationId}
            Method: put

  GetApplicationFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AppName}-${Environment}-get-application'
      Handler: handlers.get_application.handler
      Description: GET /applications/{applicationId} - 查询已有申请
      Policies:
        - DynamoDBReadPolicy:
            TableName: !ImportValue
              Fn::Sub: '${AppName}-${Environment}-TableName'
      Events:
        GetApplication:
          Type: Api
          Properties:
            RestApiId: !Ref ApplicationsApi
            Path: /applications/{applicationId}
            Method: get

Outputs:
  ApiBaseUrl:
    Description: API Gateway 基础 URL
    Value: !Sub 'https://${ApplicationsApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}'
