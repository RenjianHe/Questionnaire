AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Lambda + API Gateway layer (Python). Depends on the DynamoDB table name
  exported by infrastructure/template.yaml (via ImportValue). SAM implicitly
  creates an API Gateway REST API; the three business Lambdas are bound
  to their routes via Events.

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]

  AppName:
    Type: String
    Default: questionnaire-app

Globals:
  Function:
    Runtime: python3.12
    Timeout: 10
    MemorySize: 256
    # All four functions share the same code directory (src/) and are
    # distinguished only by Handler. No Lambda Layer, no requirements.txt —
    # boto3 ships with the Python Lambda runtime and this project has no
    # other third-party dependencies.
    CodeUri: src/
    Environment:
      Variables:
        TABLE_NAME: !ImportValue
          Fn::Sub: '${AppName}-${Environment}-TableName'
        ENVIRONMENT: !Ref Environment

Resources:
  # ---------------------------------------------------------------------
  # Mock TransUnion service: invoked synchronously by the Create/Update
  # functions, not attached to API Gateway. Returns a stable 700 or 500
  # credit score based on userId.
  # ---------------------------------------------------------------------
  TransUnionMockFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AppName}-${Environment}-transunion-mock'
      Handler: handlers.transunion_mock.handler
      Description: Mocks TransUnion, returns a credit score of 700 or 500 based on userId

  ApplicationsApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: !Ref Environment
      Auth:
        ApiKeyRequired: true

  # Requires clients to send a valid `x-api-key` header on every request.
  # The actual key value is only shown once at creation time — retrieve it
  # with: aws apigateway get-api-key --api-key <ApiKeyId> --include-value --query value --output text
  ApplicationsApiKey:
    Type: AWS::ApiGateway::ApiKey
    DependsOn: ApplicationsApi
    Properties:
      Name: !Sub '${AppName}-${Environment}-api-key'
      Enabled: true
      StageKeys:
        - RestApiId: !Ref ApplicationsApi
          StageName: !Ref Environment

  ApplicationsUsagePlan:
    Type: AWS::ApiGateway::UsagePlan
    DependsOn: ApplicationsApi
    Properties:
      UsagePlanName: !Sub '${AppName}-${Environment}-usage-plan'
      ApiStages:
        - ApiId: !Ref ApplicationsApi
          Stage: !Ref Environment

  ApplicationsUsagePlanKey:
    Type: AWS::ApiGateway::UsagePlanKey
    Properties:
      KeyId: !Ref ApplicationsApiKey
      KeyType: API_KEY
      UsagePlanId: !Ref ApplicationsUsagePlan

  CreateApplicationFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AppName}-${Environment}-create-application'
      Handler: handlers.create_application.handler
      Description: POST /applications - creates a questionnaire application and calls TransUnion (Mock)
      Environment:
        Variables:
          TRANSUNION_FUNCTION_NAME: !Ref TransUnionMockFunction
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !ImportValue
              Fn::Sub: '${AppName}-${Environment}-TableName'
        - LambdaInvokePolicy:
            FunctionName: !Ref TransUnionMockFunction
      Events:
        CreateApplication:
          Type: Api
          Properties:
            RestApiId: !Ref ApplicationsApi
            Path: /applications
            Method: post

  UpdateApplicationFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AppName}-${Environment}-update-application'
      Handler: handlers.update_application.handler
      Description: PUT /applications/{applicationId} - updates the questionnaire and re-queries TransUnion (Mock)
      Environment:
        Variables:
          TRANSUNION_FUNCTION_NAME: !Ref TransUnionMockFunction
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !ImportValue
              Fn::Sub: '${AppName}-${Environment}-TableName'
        - LambdaInvokePolicy:
            FunctionName: !Ref TransUnionMockFunction
      Events:
        UpdateApplication:
          Type: Api
          Properties:
            RestApiId: !Ref ApplicationsApi
            Path: /applications/{applicationId}
            Method: put

  GetApplicationFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AppName}-${Environment}-get-application'
      Handler: handlers.get_application.handler
      Description: GET /applications/{applicationId} - fetches an existing application
      Policies:
        - DynamoDBReadPolicy:
            TableName: !ImportValue
              Fn::Sub: '${AppName}-${Environment}-TableName'
      Events:
        GetApplication:
          Type: Api
          Properties:
            RestApiId: !Ref ApplicationsApi
            Path: /applications/{applicationId}
            Method: get

Outputs:
  ApiBaseUrl:
    Description: API Gateway base URL
    Value: !Sub 'https://${ApplicationsApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}'

  ApiKeyId:
    Description: >
      API Key ID. Get the actual key value with:
      aws apigateway get-api-key --api-key <this value> --include-value --query value --output text
    Value: !Ref ApplicationsApiKey
