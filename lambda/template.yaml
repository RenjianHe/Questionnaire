AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Lambda + API Gateway + SNS/SQS layer (Python). Depends on the DynamoDB table name
  exported by infrastructure/template.yaml (via ImportValue). SAM implicitly
  creates an API Gateway REST API; the three business Lambdas are bound
  to their routes via Events.

Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@2

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]

  AppName:
    Type: String
    Default: questionnaire-app

  DecisionEngineImageUri:
    Type: String
    Description: Immutable ECR image URI for the decision engine Fargate worker

Globals:
  Function:
    Runtime: python3.12
    Timeout: 10
    MemorySize: 256
    # All functions share the same code directory (src/) and are distinguished
    # only by Handler. No Lambda Layer, no requirements.txt —
    # boto3 ships with the Python Lambda runtime and this project has no
    # other third-party dependencies.
    CodeUri: src/
    Environment:
      Variables:
        TABLE_NAME: !ImportValue
          Fn::Sub: '${AppName}-${Environment}-TableName'
        ENVIRONMENT: !Ref Environment

Resources:
  DecisionEngineTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub '${AppName}-${Environment}-decision-engine-requests'

  DecisionEngineDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub '${AppName}-${Environment}-decision-engine-dead-letter'
      MessageRetentionPeriod: 1209600

  DecisionEngineQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub '${AppName}-${Environment}-decision-engine-requests'
      VisibilityTimeout: 300
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt DecisionEngineDeadLetterQueue.Arn
        maxReceiveCount: 5

  DecisionEngineQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref DecisionEngineQueue
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: sns.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt DecisionEngineQueue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !Ref DecisionEngineTopic
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId

  DecisionEngineSubscription:
    Type: AWS::SNS::Subscription
    DependsOn: DecisionEngineQueuePolicy
    Properties:
      TopicArn: !Ref DecisionEngineTopic
      Protocol: sqs
      Endpoint: !GetAtt DecisionEngineQueue.Arn
      RawMessageDelivery: true

  DecisionEngineCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub '${AppName}-${Environment}-decision-engine'

  DecisionEngineLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/ecs/${AppName}-${Environment}-decision-engine'
      RetentionInDays: 30

  DecisionEngineTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  DecisionEngineTaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ReadDecisionEngineRequestsAndUpdateApplications
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                Resource: !GetAtt DecisionEngineQueue.Arn
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                Resource: !ImportValue
                  Fn::Sub: '${AppName}-${Environment}-TableArn'

  DecisionEngineTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    DependsOn: DecisionEngineLogGroup
    Properties:
      Family: !Sub '${AppName}-${Environment}-decision-engine'
      RequiresCompatibilities:
        - FARGATE
      NetworkMode: awsvpc
      Cpu: '256'
      Memory: '512'
      ExecutionRoleArn: !GetAtt DecisionEngineTaskExecutionRole.Arn
      TaskRoleArn: !GetAtt DecisionEngineTaskRole.Arn
      ContainerDefinitions:
        - Name: decision-engine-worker
          Image: !Ref DecisionEngineImageUri
          Essential: true
          Environment:
            - Name: TABLE_NAME
              Value: !ImportValue
                Fn::Sub: '${AppName}-${Environment}-TableName'
            - Name: AWS_DEFAULT_REGION
              Value: !Ref AWS::Region
            - Name: DECISION_ENGINE_QUEUE_URL
              Value: !Ref DecisionEngineQueue
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref DecisionEngineLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: worker

  DecisionEngineSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Outbound-only access for the decision engine SQS worker
      VpcId: !ImportValue
        Fn::Sub: '${AppName}-${Environment}-DecisionEngineVpcId'
      SecurityGroupEgress:
        - IpProtocol: '-1'
          CidrIp: 0.0.0.0/0

  DecisionEngineService:
    Type: AWS::ECS::Service
    DependsOn: DecisionEngineQueuePolicy
    Properties:
      ServiceName: !Sub '${AppName}-${Environment}-decision-engine'
      Cluster: !Ref DecisionEngineCluster
      TaskDefinition: !Ref DecisionEngineTaskDefinition
      DesiredCount: 1
      LaunchType: FARGATE
      PlatformVersion: LATEST
      DeploymentConfiguration:
        MinimumHealthyPercent: 0
        MaximumPercent: 100
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          SecurityGroups:
            - !GetAtt DecisionEngineSecurityGroup.GroupId
          Subnets:
            - !ImportValue
              Fn::Sub: '${AppName}-${Environment}-DecisionEnginePublicSubnetA'
            - !ImportValue
              Fn::Sub: '${AppName}-${Environment}-DecisionEnginePublicSubnetB'

  DecisionEngineScalableTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    DependsOn: DecisionEngineService
    Properties:
      MaxCapacity: 5
      MinCapacity: 1
      ResourceId: !Sub 'service/${DecisionEngineCluster}/${AppName}-${Environment}-decision-engine'
      RoleARN: !Sub 'arn:aws:iam::${AWS::AccountId}:role/aws-service-role/ecs.application-autoscaling.amazonaws.com/AWSServiceRoleForApplicationAutoScaling_ECSService'
      ScalableDimension: ecs:service:DesiredCount
      ServiceNamespace: ecs

  DecisionEngineScaleOutPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: !Sub '${AppName}-${Environment}-decision-engine-scale-out'
      PolicyType: StepScaling
      ScalingTargetId: !Ref DecisionEngineScalableTarget
      StepScalingPolicyConfiguration:
        AdjustmentType: ChangeInCapacity
        Cooldown: 60
        MetricAggregationType: Average
        StepAdjustments:
          - MetricIntervalLowerBound: 0
            ScalingAdjustment: 1
            MetricIntervalUpperBound: 50
          - MetricIntervalLowerBound: 50
            ScalingAdjustment: 3
            MetricIntervalUpperBound: 190
          - MetricIntervalLowerBound: 190
            ScalingAdjustment: 4

  DecisionEngineCpuTrackingPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: !Sub '${AppName}-${Environment}-decision-engine-cpu-tracking'
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref DecisionEngineScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: ECSServiceAverageCPUUtilization
        TargetValue: 60

  DecisionEngineBacklogScaleOutAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Adds a worker when at least 10 decision engine messages are visible
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt DecisionEngineQueue.QueueName
      Statistic: Average
      Period: 60
      EvaluationPeriods: 1
      Threshold: 10
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref DecisionEngineScaleOutPolicy

  ApplicationsApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: !Ref Environment
      Auth:
        ApiKeyRequired: true

  # Requires clients to send a valid `x-api-key` header on every request.
  # The actual key value is only shown once at creation time — retrieve it
  # with: aws apigateway get-api-key --api-key <ApiKeyId> --include-value --query value --output text
  ApplicationsApiKey:
    Type: AWS::ApiGateway::ApiKey
    Properties:
      Name: !Sub '${AppName}-${Environment}-api-key'
      Enabled: true
      StageKeys:
        - RestApiId: !Ref ApplicationsApi
          # Ref the generated stage so CloudFormation waits for its creation.
          StageName: !Ref ApplicationsApi.Stage

  ApplicationsUsagePlan:
    Type: AWS::ApiGateway::UsagePlan
    Properties:
      UsagePlanName: !Sub '${AppName}-${Environment}-usage-plan'
      ApiStages:
        - ApiId: !Ref ApplicationsApi
          # The REST API alone can exist before its stage is ready.
          Stage: !Ref ApplicationsApi.Stage

  ApplicationsUsagePlanKey:
    Type: AWS::ApiGateway::UsagePlanKey
    Properties:
      KeyId: !Ref ApplicationsApiKey
      KeyType: API_KEY
      UsagePlanId: !Ref ApplicationsUsagePlan

  CreateApplicationFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AppName}-${Environment}-create-application'
      Handler: handlers.create_application.handler
      Description: POST /applications - creates a pending questionnaire and queues a decision
      Environment:
        Variables:
          DECISION_ENGINE_TOPIC_ARN: !Ref DecisionEngineTopic
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !ImportValue
              Fn::Sub: '${AppName}-${Environment}-TableName'
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: sns:Publish
              Resource: !Ref DecisionEngineTopic
      Events:
        CreateApplication:
          Type: Api
          Properties:
            RestApiId: !Ref ApplicationsApi
            Path: /applications
            Method: post

  UpdateApplicationFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AppName}-${Environment}-update-application'
      Handler: handlers.update_application.handler
      Description: PUT /applications/{applicationId} - updates the questionnaire and queues a decision
      Environment:
        Variables:
          DECISION_ENGINE_TOPIC_ARN: !Ref DecisionEngineTopic
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !ImportValue
              Fn::Sub: '${AppName}-${Environment}-TableName'
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: sns:Publish
              Resource: !Ref DecisionEngineTopic
      Events:
        UpdateApplication:
          Type: Api
          Properties:
            RestApiId: !Ref ApplicationsApi
            Path: /applications/{applicationId}
            Method: put

  GetApplicationFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AppName}-${Environment}-get-application'
      Handler: handlers.get_application.handler
      Description: GET /applications/{applicationId} - fetches an existing application
      Policies:
        - DynamoDBReadPolicy:
            TableName: !ImportValue
              Fn::Sub: '${AppName}-${Environment}-TableName'
      Events:
        GetApplication:
          Type: Api
          Properties:
            RestApiId: !Ref ApplicationsApi
            Path: /applications/{applicationId}
            Method: get

Outputs:
  ApiBaseUrl:
    Description: API Gateway base URL
    Value: !Sub 'https://${ApplicationsApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}'

  ApiKeyId:
    Description: >
      API Key ID. Get the actual key value with:
      aws apigateway get-api-key --api-key <this value> --include-value --query value --output text
    Value: !Ref ApplicationsApiKey
