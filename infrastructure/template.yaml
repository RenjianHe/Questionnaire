AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Infrastructure layer — data layer and decision engine container image resources.
  Deployed separately from lambda/template.yaml (compute + API gateway layer),
  cross-stack references are done via CloudFormation Export/ImportValue.

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
    Description: Deployment environment name, used to isolate resource naming

  AppName:
    Type: String
    Default: questionnaire-app
    Description: Application name prefix, used for resource and export naming

Resources:
  DecisionEngineRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub '${AppName}-${Environment}-decision-engine'
      ImageScanningConfiguration:
        ScanOnPush: true
      ImageTagMutability: IMMUTABLE

  DecisionEngineVpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.42.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: !Sub '${AppName}-${Environment}-decision-engine'

  DecisionEngineInternetGateway:
    Type: AWS::EC2::InternetGateway

  DecisionEngineVpcGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref DecisionEngineVpc
      InternetGatewayId: !Ref DecisionEngineInternetGateway

  DecisionEnginePublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref DecisionEngineVpc

  DecisionEnginePublicRoute:
    Type: AWS::EC2::Route
    DependsOn: DecisionEngineVpcGatewayAttachment
    Properties:
      RouteTableId: !Ref DecisionEnginePublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref DecisionEngineInternetGateway

  DecisionEnginePublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref DecisionEngineVpc
      AvailabilityZone: !Select [0, !GetAZs '']
      CidrBlock: 10.42.1.0/24
      MapPublicIpOnLaunch: true

  DecisionEnginePublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref DecisionEngineVpc
      AvailabilityZone: !Select [1, !GetAZs '']
      CidrBlock: 10.42.2.0/24
      MapPublicIpOnLaunch: true

  DecisionEnginePublicSubnetARouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref DecisionEnginePublicSubnetA
      RouteTableId: !Ref DecisionEnginePublicRouteTable

  DecisionEnginePublicSubnetBRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref DecisionEnginePublicSubnetB
      RouteTableId: !Ref DecisionEnginePublicRouteTable

  ApplicationsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub '${AppName}-${Environment}-applications'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: applicationId
          AttributeType: S
      KeySchema:
        - AttributeName: applicationId
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES

Outputs:
  ApplicationsTableName:
    Description: DynamoDB table name, referenced by the lambda stack via ImportValue
    Value: !Ref ApplicationsTable
    Export:
      Name: !Sub '${AppName}-${Environment}-TableName'

  ApplicationsTableArn:
    Description: DynamoDB table ARN, needed by the lambda stack's IAM policies
    Value: !GetAtt ApplicationsTable.Arn
    Export:
      Name: !Sub '${AppName}-${Environment}-TableArn'

  ApplicationsStreamArn:
    Description: DynamoDB Streams ARN consumed by the data-streaming stack
    Value: !GetAtt ApplicationsTable.StreamArn
    Export:
      Name: !Sub '${AppName}-${Environment}-ApplicationsStreamArn'

  DecisionEngineRepositoryUri:
    Description: ECR image repository used by the decision engine Fargate service
    Value: !GetAtt DecisionEngineRepository.RepositoryUri

  DecisionEngineVpcId:
    Value: !Ref DecisionEngineVpc
    Export:
      Name: !Sub '${AppName}-${Environment}-DecisionEngineVpcId'

  DecisionEnginePublicSubnetA:
    Value: !Ref DecisionEnginePublicSubnetA
    Export:
      Name: !Sub '${AppName}-${Environment}-DecisionEnginePublicSubnetA'

  DecisionEnginePublicSubnetB:
    Value: !Ref DecisionEnginePublicSubnetB
    Export:
      Name: !Sub '${AppName}-${Environment}-DecisionEnginePublicSubnetB'
