AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Infrastructure layer — data layer resources (DynamoDB).
  Deployed separately from lambda/template.yaml (compute + API layer),
  cross-stack references are done via CloudFormation Export/ImportValue.

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
    Description: Deployment environment name, used to isolate resource naming

  AppName:
    Type: String
    Default: questionnaire-app
    Description: Application name prefix, used for resource and export naming

Resources:
  ApplicationsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub '${AppName}-${Environment}-applications'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: applicationId
          AttributeType: S
      KeySchema:
        - AttributeName: applicationId
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true

Outputs:
  ApplicationsTableName:
    Description: DynamoDB table name, referenced by the lambda stack via ImportValue
    Value: !Ref ApplicationsTable
    Export:
      Name: !Sub '${AppName}-${Environment}-TableName'

  ApplicationsTableArn:
    Description: DynamoDB table ARN, needed by the lambda stack's IAM policies
    Value: !GetAtt ApplicationsTable.Arn
    Export:
      Name: !Sub '${AppName}-${Environment}-TableArn'
