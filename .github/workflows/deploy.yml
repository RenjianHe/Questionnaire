name: Deploy to AWS

on:
  push:
    branches: [main]

env:
  AWS_REGION: us-east-1
  APP_NAME: questionnaire-app
  ENVIRONMENT: dev
  INFRA_STACK_NAME: questionnaire-app-infra-dev
  LAMBDA_STACK_NAME: questionnaire-app-lambda-dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Run unit tests before touching AWS — a failing test blocks deployment
      - name: Run unit tests
        working-directory: lambda
        run: |
          pip install -r requirements-dev.txt
          pytest -v

      # Step 1: deploy data, ECR, and worker networking infrastructure
      - name: Deploy infra stack
        run: |
          aws cloudformation deploy \
            --template-file infrastructure/template.yaml \
            --stack-name ${{ env.INFRA_STACK_NAME }} \
            --parameter-overrides Environment=${{ env.ENVIRONMENT }} AppName=${{ env.APP_NAME }} \
            --no-fail-on-empty-changeset

      - name: Build and push decision engine worker image
        id: decision-engine-image
        run: |
          ECR_REPOSITORY_URI=$(aws cloudformation describe-stacks \
            --stack-name ${{ env.INFRA_STACK_NAME }} \
            --query "Stacks[0].Outputs[?OutputKey=='DecisionEngineRepositoryUri'].OutputValue" \
            --output text)
          ECR_REGISTRY=$(printf '%s' "$ECR_REPOSITORY_URI" | cut -d/ -f1)
          IMAGE_URI="${ECR_REPOSITORY_URI}:${GITHUB_SHA}"
          aws ecr get-login-password --region "${{ env.AWS_REGION }}" \
            | docker login --username AWS --password-stdin "$ECR_REGISTRY"
          docker build -f lambda/Dockerfile -t "$IMAGE_URI" lambda
          docker push "$IMAGE_URI"
          echo "image_uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"

      # Step 2: deploy API Lambdas and the decision engine Fargate service
      - name: Install AWS SAM CLI
        run: pip install aws-sam-cli

      - name: sam build
        working-directory: lambda
        run: sam build

      - name: sam deploy
        working-directory: lambda
        run: |
          sam deploy \
            --stack-name ${{ env.LAMBDA_STACK_NAME }} \
            --resolve-s3 \
            --capabilities CAPABILITY_IAM \
            --region ${{ env.AWS_REGION }} \
            --parameter-overrides Environment=${{ env.ENVIRONMENT }} AppName=${{ env.APP_NAME }} DecisionEngineImageUri=${{ steps.decision-engine-image.outputs.image_uri }} \
            --no-fail-on-empty-changeset \
            --no-confirm-changeset
